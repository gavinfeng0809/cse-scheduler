server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # 【修复】docker 内置 DNS：让 proxy_pass 里的服务名在运行期解析。
    # 否则 nginx 只在启动时解析一次，api/frontend 容器被重建（IP 变化）后
    # 会持续 502，必须手工 restart nginx —— 本项已在 2026-09-21 实际踩到。
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$request_uri;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Solver 同步求解最长可达 SOLVER_TIME_LIMIT 秒，nginx 默认 60s 会 504
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /health {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream/health;
        proxy_read_timeout 30s;
    }

    location / {
        set $frontend_upstream http://frontend:80;
        proxy_pass $frontend_upstream$request_uri;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
